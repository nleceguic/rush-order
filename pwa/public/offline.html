<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E63946" />
  <title>Sin conexión · Rush Order</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:  #E63946;
      --dark: #1D3557;
      --gray: #6B7280;
      --bg:   #F9FAFB;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .icon {
      width: 80px; height: 80px;
      background: var(--red);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon svg { width: 40px; height: 40px; color: white; }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--gray);
      font-size: 0.9375rem;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto 2rem;
    }

    button {
      background: var(--red);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover   { opacity: 0.9; }
    button:active  { opacity: 0.8; }

    /* WCAG focus */
    button:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--gray);
    }
  </style>
</head>
<body>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1>Sin conexión</h1>
  <p>
    No hay red disponible. Comprueba tu conexión a internet e inténtalo de nuevo.
    Si ya visitaste el menú antes, puede que aún esté disponible.
  </p>

  <button type="button" onclick="window.location.reload()">
    Reintentar
  </button>

  <footer>Rush Order · Pide desde tu mesa</footer>
</body>
</html>
