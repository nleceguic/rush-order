name: Rotate Secrets

on:
  # Every 90 days: 1st of Jan, Apr, Jul, Oct at 04:00 UTC
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  # Manual override
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [production, staging]
        default: production
      dry_run:
        description: 'Dry run (generate keys only, skip Key Vault update)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC for Azure login
  contents: read
  issues: write     # open a tracking issue on completion

jobs:
  rotate:
    name: Rotate JWT RSA keys
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate new RSA-4096 key pair
        id: keygen
        run: |
          openssl genrsa -out /tmp/private.pem 4096 2>/dev/null
          openssl rsa -in /tmp/private.pem -pubout -out /tmp/public.pem 2>/dev/null
          echo "Keys generated successfully"

      - name: Upload to Key Vault
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          az keyvault secret set \
            --vault-name "${{ secrets.KEY_VAULT_NAME }}" \
            --name "JwtPrivateKey" \
            --file /tmp/private.pem \
            --content-type "text/plain" \
            --tags "rotated=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output none

          az keyvault secret set \
            --vault-name "${{ secrets.KEY_VAULT_NAME }}" \
            --name "JwtPublicKey" \
            --file /tmp/public.pem \
            --content-type "text/plain" \
            --tags "rotated=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output none

          echo "Key Vault updated"

      - name: Restart App Service (rolling)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          az webapp restart \
            --name "${{ secrets.APP_SERVICE_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "App Service restart triggered"

      - name: Verify health post-rotation
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          sleep 30
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.APP_HOSTNAME }}/health" --max-time 20 || echo "000")
          echo "Health check status: ${HTTP}"
          [ "${HTTP}" = "200" ] || (echo "FAILED: App unhealthy after rotation" && exit 1)

      - name: Clean up key material
        if: always()
        run: rm -f /tmp/private.pem /tmp/public.pem

      - name: Open tracking issue
        if: ${{ github.event.inputs.dry_run != 'true' && success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const env = context.payload.inputs?.environment || 'production';
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] JWT keys rotated — ${env} — ${date}`,
              body: `Automated secret rotation completed.\n\n- Environment: **${env}**\n- Date: ${date}\n- Next rotation: in 90 days\n- Triggered by: ${context.eventName}`,
              labels: ['security', 'automated']
            });
