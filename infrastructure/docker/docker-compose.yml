services:
  postgres:
    image: postgres:16-alpine
    container_name: rushorder_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rushorder_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rushorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rushorder_dev_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rushorder} -d ${POSTGRES_DB:-rushorder_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rushorder_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: rushorder_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rushorder.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: rushorder_mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: development
    container_name: rushorder_api
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-rushorder_dev};Username=${POSTGRES_USER:-rushorder};Password=${POSTGRES_PASSWORD:-rushorder_dev_pass}"
      Redis__ConnectionString: "redis:6379"
      Jwt__Secret: "${JWT_KEY:-change_me_in_development_only_secret_key_32chars}"
      Jwt__Issuer: "${JWT_ISSUER:-rush-order-api}"
      Jwt__Audience: "${JWT_AUDIENCE:-rush-order-clients}"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    volumes:
      - ../../backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
