name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rush-order-api

jobs:
  # ─── JOB 1: Backend (.NET) ─────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore rush-order.sln

      - name: Build
        run: dotnet build rush-order.sln -c Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test rush-order.sln -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test-results.trx"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage-report" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura" \
            "-assemblyfilters:+RushOrder.Domain;+RushOrder.Application;+RushOrder.Infrastructure"

      - name: Check coverage threshold (≥ 70%)
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, sys, os

          report = "coverage-report/Cobertura.xml"
          if not os.path.exists(report):
              print("No coverage report found — skipping threshold check")
              sys.exit(0)

          rate = float(ET.parse(report).getroot().get("line-rate", 0)) * 100
          print(f"Line coverage: {rate:.1f}%")
          if rate < 70:
              print(f"ERROR: {rate:.1f}% is below the 70% threshold")
              sys.exit(1)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/**/*.trx
          retention-days: 14

  # ─── JOB 2: PWA (Node) ─────────────────────────────────────────────────────
  pwa-ci:
    name: PWA CI (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload PWA build artifact (for Lighthouse job)
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build-${{ github.sha }}
          path: pwa/dist/
          retention-days: 1

  # ─── JOB 2b: Lighthouse CI (runs against local preview server) ──────────────
  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: pwa-ci
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download PWA build
        uses: actions/download-artifact@v4
        with:
          name: pwa-build-${{ github.sha }}
          path: pwa/dist

      - name: Run Lighthouse CI (score > 90 required)
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ github.sha }}
          path: pwa/.lighthouseci/
          retention-days: 14

  # ─── JOB 3: Docker build + Trivy security scan ─────────────────────────────
  docker-build-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for SARIF upload
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=ci-scan,enable=true

      - name: Build Docker image (no push on feature branches)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Run Trivy vulnerability scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy scan (SARIF for GitHub Security tab)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─── JOB 4: OWASP ZAP DAST (solo en PRs a main) ───────────────────────────
  dast-zap:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan against staging
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_API_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false  # warn only — don't fail CI on new findings

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 14

  # ─── JOB 5: Vulnerable NuGet / npm packages ────────────────────────────────
  security-scan:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore rush-order.sln

      - name: Check vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            cat vulnerable.txt
            exit 1
          fi
          echo "No vulnerable NuGet packages found."

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check vulnerable npm packages
        working-directory: pwa
        run: |
          npm ci --prefer-offline 2>/dev/null || npm install
          npm audit --audit-level=high
